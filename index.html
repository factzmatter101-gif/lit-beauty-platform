<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Love That Idea — LTI Ventures</title>

    <!-- Three.js for 3D Nail Render — loaded before app bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; width: 100%; overflow: hidden; background: #0D2818; }
      #lti-loading {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0D2818; z-index: 9999; gap: 14px;
      }
      .lti-icon  { font-size: 52px; }
      .lti-title { font-family: -apple-system, sans-serif; font-size: 22px; font-weight: 900; color: #fff; }
      .lti-sub   { font-family: -apple-system, sans-serif; font-size: 11px; color: #27AE78; letter-spacing: 3px; text-transform: uppercase; }
      .lti-bar-wrap { width: 180px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
      .lti-bar   { height: 100%; width: 0%; background: linear-gradient(90deg, #27AE78, #C9A84C); border-radius: 4px; transition: width 0.3s ease; }
    </style>
  </head>
  <body>

    <div id="lti-loading">
      <div class="lti-icon">💅</div>
      <div class="lti-title">Love That Idea</div>
      <div class="lti-sub">Beauty Intelligence Platform</div>
      <div class="lti-bar-wrap"><div class="lti-bar" id="lti-bar"></div></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/main.jsx"></script>
  </body>
</html>
